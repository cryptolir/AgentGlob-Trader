name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: The server starts and refuses to run without its settings
        run: |
          set +e
          node dist/mcp/hyperliquid/server.js </dev/null 2>err.txt
          code=$?
          cat err.txt
          test "$code" = 1 && grep -q "AGENTGLOB_RUNTIME_URL" err.txt
      # The exact command in the README: npx straight from GitHub, which builds
      # on the user's machine. Node 20/22 ship npm 10, whose peer resolution
      # crashed here — silently — before the lockfile. Deliberately NOT pinned
      # to a commit: npm 10 has a second bug with full-sha specs ("GitFetcher
      # requires an Arborist constructor"), and the README does not pin either.
      # Push-only, so it tests main as users get it.
      - name: Installs and starts the way users run it (npx from GitHub)
        if: github.event_name == 'push'
        run: |
          set +e
          cd "$RUNNER_TEMP"
          npx -y "github:${{ github.repository }}" </dev/null 2>err.txt
          code=$?
          cat err.txt
          test "$code" = 1 && grep -q "AGENTGLOB_RUNTIME_URL" err.txt
